name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  estimators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the dependencies the tests need
        run: pip install numpy pandas scipy statsmodels anndata matplotlib pytest
      - name: Run the estimator tests
        run: python -m pytest tests -q
